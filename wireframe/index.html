<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>알앤디 사전가입</title>
<style>
  /* ===========================================================
     흑백 뼈대. 검정, 흰색, 회색만 사용합니다.
     모바일(폭 390) 기준이고, PC에서 열면 가운데에 좁게 보입니다.
     =========================================================== */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
    background: #fff;
    color: #000;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }

  .phone { width: 100%; max-width: 390px; margin: 0 auto; }

  /* 상단바. 스크롤해도 위에 붙어 있습니다 */
  .appbar {
    position: sticky; top: 0; z-index: 5;
    background: #fff;
    display: flex; align-items: center; gap: 10px;
    height: 52px; padding: 0 16px;
    border-bottom: 1px solid #ccc;
  }
  .appbar .logo {
    width: 26px; height: 26px;
    border: 1px solid #000;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px;
  }
  .appbar .home { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #000; }
  .appbar .title { font-size: 14px; font-weight: 700; }
  .appbar .right { margin-left: auto; font-size: 12px; color: #666; }
  .appbar .back {
    font: inherit; font-size: 13px; background: none;
    border: 0; padding: 0; cursor: pointer; text-decoration: underline;
  }

  .sec { padding: 20px 16px; border-bottom: 1px solid #eee; }
  .sec.last { border-bottom: 0; }

  h1 { font-size: 22px; line-height: 1.35; margin-bottom: 8px; }
  h2 { font-size: 16px; margin-bottom: 10px; }
  h3 { font-size: 14px; margin-bottom: 4px; }
  p  { font-size: 13px; color: #444; }
  .muted { color: #777; font-size: 12px; }

  /* 내용이 들어갈 자리 표시 */
  .ph {
    border: 1px dashed #aaa; background: #f5f5f5;
    color: #777; font-size: 12px;
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 12px;
  }
  .line { height: 10px; background: #e5e5e5; margin-bottom: 6px; }
  .line.s { width: 60%; }

  .tag {
    display: inline-block; border: 1px solid #000;
    font-size: 11px; padding: 2px 7px; margin-bottom: 10px;
  }

  .card { border: 1px solid #ccc; padding: 14px; margin-bottom: 10px; }
  .card:last-child { margin-bottom: 0; }

  .row { display: flex; gap: 10px; align-items: flex-start; }
  .num {
    flex-shrink: 0; width: 22px; height: 22px;
    border: 1px solid #000; border-radius: 50%;
    font-size: 12px; display: flex; align-items: center; justify-content: center;
  }

  /* 진행바 */
  .bar { height: 10px; border: 1px solid #999; margin: 10px 0 6px; }
  .bar > i { display: block; height: 100%; background: #999; width: 60%; }
  .barlabel { display: flex; justify-content: space-between; font-size: 11px; color: #777; }

  /* 버튼. 본문 안에 놓습니다 */
  .btn {
    display: block; width: 100%;
    font: inherit; font-size: 15px; font-weight: 700;
    padding: 14px; cursor: pointer;
    background: #000; color: #fff; border: 1px solid #000;
  }
  .btn.sub { background: #fff; color: #000; }
  .btn:disabled { background: #eee; color: #999; border-color: #eee; cursor: not-allowed; }
  .btn + .btn { margin-top: 8px; }
  .cta { margin-top: 18px; }
  .cta .hint { text-align: center; font-size: 11px; color: #777; margin-top: 8px; }
  .textlink {
    display: inline-block; font-size: 13px; color: #000;
    text-decoration: underline; margin-top: 10px;
  }
  button.textlink { font: inherit; font-size: 13px; background: none; border: 0; padding: 0; cursor: pointer; }

  /* 폼 */
  .field { margin-bottom: 18px; }
  .field > label.lb { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
  .req { font-weight: 400; color: #777; font-size: 11px; }
  input[type=text], input[type=email], input[type=number], select, textarea {
    font: inherit; font-size: 14px; width: 100%;
    padding: 11px 12px; border: 1px solid #999; background: #fff; color: #000;
    border-radius: 0;
  }
  textarea { min-height: 74px; resize: vertical; }
  /* 인증 완료 상자 */
  .verified { border: 1px solid #000; padding: 14px; font-size: 13px; }
  .verified b { font-size: 14px; }

  /* 달력 */
  .calhead { text-align: center; font-size: 15px; font-weight: 700; margin-bottom: 12px; }
  .cal { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .cal th, .cal td { border: 0; background: none; padding: 2px; text-align: center; }
  .cal th { font-size: 11px; color: #777; font-weight: 400; padding-bottom: 6px; }
  .cal .day {
    display: block; width: 100%; font: inherit; font-size: 13px;
    padding: 9px 0 7px; background: none; border: 1px solid transparent; color: #000;
  }
  .cal .day.has { border-color: #000; cursor: pointer; }
  .cal .day.full { border-color: #ddd; color: #aaa; cursor: pointer; }
  .cal .day.on { background: #000; color: #fff; border-color: #000; }
  .cal .mark { display: block; font-size: 9px; line-height: 1.2; margin-top: 2px; }
  .callegend { font-size: 11px; color: #777; margin-top: 10px; text-align: center; }
  .choices { display: flex; gap: 8px; flex-wrap: wrap; }
  .choices label {
    font-size: 14px; padding: 10px 14px; border: 1px solid #999; cursor: pointer;
    display: flex; align-items: center; gap: 6px;
  }
  .choices input { accent-color: #000; }
  .err { display: none; font-size: 12px; margin-top: 6px; }
  .field.bad .err { display: block; }
  .field.bad input, .field.bad select, .field.bad textarea,
  .field.bad .choices label { border-color: #000; border-width: 2px; }
  .field.bad .err::before { content: "! "; font-weight: 700; }

  .agree { display: flex; gap: 10px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid #eee; }
  .agree:last-of-type { border-bottom: 0; }
  .agree input { margin-top: 3px; accent-color: #000; }
  .agree label { font-size: 13px; }
  .agree .link { font-size: 11px; color: #777; text-decoration: underline; margin-left: auto; white-space: nowrap; }
  .allagree { border: 1px solid #000; padding: 12px; margin-bottom: 6px; }

  .steps { font-size: 12px; color: #666; margin-bottom: 12px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { border: 1px solid #ccc; padding: 8px 10px; text-align: left; }
  th { background: #f2f2f2; font-size: 12px; font-weight: 700; }

  /* 상단바 오른쪽: 사전가입 버튼 + 햄버거 */
  .appbar .rightgroup { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .topcta {
    font: inherit; font-size: 12px; font-weight: 700;
    background: #000; color: #fff; border: 1px solid #000;
    padding: 8px 12px; cursor: pointer;
  }

  /* 햄버거 버튼 (가로 3줄) */
  .hamb {
    background: none; border: 0; padding: 4px;
    cursor: pointer; display: block;
  }
  .hamb i { display: block; width: 20px; height: 2px; background: #000; margin: 4px 0; }

  /* 햄버거가 X로 바뀔 때 */
  .hamb.x i { display: none; }
  .hamb .xmark { display: none; font-size: 20px; line-height: 20px; width: 20px; }
  .hamb.x .xmark { display: block; }

  /* 메뉴. 상단바 바로 아래로 펼쳐집니다. 뒤쪽 페이지는 그대로 보입니다 */
  .menu {
    display: none;
    position: fixed; top: 52px; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 390px; z-index: 20;
    background: #fff; border-bottom: 1px solid #ccc;
  }
  .menu.on { display: block; }
  .menu nav a {
    display: block; padding: 18px 16px; border-bottom: 1px solid #eee;
    font-size: 17px; color: #000; text-decoration: none;
  }
  .menu nav a.on { font-weight: 700; }
  .menu nav a .sub { display: block; font-size: 12px; color: #777; margin-top: 3px; font-weight: 400; }

  /* 친구 추천 페이지에 넣는 룰렛 그림 */
  .wheelshot { position: relative; width: 260px; margin: 0 auto; }
  .wheelshot > img { width: 100%; display: block; }
  .wheelshot .pin {
    position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 10px solid transparent; border-right: 10px solid transparent;
    border-top: 18px solid #191F28;
  }
  .wheelshot .hubmark {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 74px; height: 74px; border-radius: 50%; background: #fff;
    box-shadow: 0 4px 14px rgba(1,55,49,.16);
    display: flex; align-items: center; justify-content: center;
  }
  .wheelshot .hubmark img { width: 38px; height: 38px; border-radius: 10px; }

  /* 팝업 (인스타그램 팔로우 안내) */
  .modal {
    display: none;
    position: fixed; inset: 0; z-index: 30;
    align-items: center; justify-content: center; padding: 24px;
    background: rgba(0,0,0,.55);
  }
  .modal.on { display: flex; }
  .modal .box {
    width: 100%; max-width: 320px; background: #fff;
    border: 1px solid #000; padding: 24px 20px 20px;
  }
  .modal .must {
    display: inline-block; border: 1px solid #000;
    font-size: 11px; font-weight: 700; padding: 2px 7px; margin-bottom: 12px;
  }
  .modal h2 { font-size: 18px; line-height: 1.4; margin-bottom: 8px; }
  .modal p { font-size: 13px; line-height: 1.6; color: #444; }
  .modal .account {
    margin: 16px 0; padding: 12px;
    border: 1px solid #ccc; text-align: center;
    font-size: 15px; font-weight: 700;
  }
  .modal .later {
    display: block; width: 100%; margin-top: 10px;
    font: inherit; font-size: 13px; color: #777;
    background: none; border: 0; padding: 8px; cursor: pointer; text-decoration: underline;
  }

  /* 사이트 푸터. 항상 맨 아래 */
  .sitefoot { padding: 22px 16px 30px; text-align: center; background: #fafafa; }
  .sitefoot .links { font-size: 12px; margin-bottom: 10px; }
  .sitefoot .links a { color: #000; text-decoration: underline; }
  .sitefoot .copy { font-size: 11px; color: #888; }
  .sitefoot .restart {
    font: inherit; font-size: 11px; color: #aaa;
    background: none; border: 0; margin-top: 14px;
    text-decoration: underline; cursor: pointer;
  }
</style>
</head>
<body>

<div id="stage"></div>

<div class="modal" id="follow">
  <div class="box">
    <span class="must">필수</span>
    <h2>인스타그램 팔로우는<br>필수예요</h2>
    <p>사전가입은 인스타그램 팔로우까지 마쳐야 완료됩니다. 아래 버튼을 눌러 팔로우해 주세요.</p>
    <div class="account">@알앤디_계정명</div>
    <button class="btn" onclick="alert('인스타그램 계정 주소는 아직 정해지지 않았습니다')">인스타그램에서 팔로우하기</button>
    <button class="later" onclick="closeFollow()">닫기</button>
  </div>
</div>

<div class="menu" id="menu">
  <nav id="menunav"></nav>
</div>

<script>
/* ===============================================================
   알앤디 사전가입 뼈대
   흑백이지만 실제로 눌러서 끝까지 진행되는 사이트입니다.
   로그인 기능이 없다는 전제로 만들었습니다.
   =============================================================== */

/* ---------------------------------------------------------------
   0. 입력 검사 켜고 끄기

   true 로 두면 아무것도 입력하지 않아도 다음 단계로 넘어갑니다.
   (필수값, 약관 동의, 학력 인증 전부 통과)
   지금은 뼈대를 빠르게 훑어보는 단계라 true 입니다.
   --------------------------------------------------------------- */
var SKIP_VALIDATION = true;

/* ---------------------------------------------------------------
   1. 신청서에서 받을 항목
   아직 확정 전입니다. 확정되면 이 목록만 고치면 화면이 따라 바뀝니다.
   --------------------------------------------------------------- */
var YEARS = [];
for (var y = 2006; y >= 1975; y--) YEARS.push(String(y));

var SIGNUP_FIELDS = [
  { key: 'name',   label: '이름',      type: 'text',   required: true, placeholder: '홍길동' },
  { key: 'gender', label: '성별',      type: 'radio',  required: true, options: ['남성', '여성'] },
  { key: 'birth',  label: '출생년도',  type: 'select', required: true, options: YEARS },
  { key: 'region', label: '지역',      type: 'select', required: true,
    options: ['서울', '경기·인천', '부산·경남', '대구·경북', '대전·충청', '광주·전라', '강원', '제주', '해외'] },
  { key: 'degree', label: '학위',      type: 'select', required: true,
    options: ['석사 재학', '석사 졸업', '박사 재학', '박사 졸업'] },
  { key: 'phone', label: '전화번호', type: 'text', required: true,
    placeholder: '010-0000-0000' },
  { key: 'referral', label: '추천인 코드', type: 'text', required: false,
    placeholder: '친구에게 받은 코드가 있다면 입력하세요' }
];

/* 로테이션 신청서의 기본 정보는 사전가입과 똑같습니다 */
var ROTATION_FIELDS = SIGNUP_FIELDS;

/* 미팅 일정. 달력에 표시됩니다.
   날짜, 장소, 시간, 정원, 현재 신청 인원 모두 자리만 잡아둔 예시입니다. */
var CAL_MONTH = '2026-08';
var MEETINGS = [
  { date: '2026-08-16', place: '장소 자리 (예: 강남)', time: '오후 7시',      cap: 12, joined: 5 },
  { date: '2026-08-20', place: '장소 자리 (예: 성수)', time: '오후 7시 30분', cap: 10, joined: 10 },
  { date: '2026-08-23', place: '장소 자리 (예: 홍대)', time: '오후 6시',      cap: 12, joined: 3 },
  { date: '2026-08-30', place: '장소 자리 (예: 판교)', time: '오후 7시',      cap: 8,  joined: 0 }
];
var DOW = ['일', '월', '화', '수', '목', '금', '토'];

/* 참가비. 아직 정해지지 않아 자리만 잡아둔 값입니다 */
var FEE = {
  amount: '000,000원',
  bank: '○○은행 000-0000-000000',
  holder: 'ZIZZY STUDIO',
  due: '신청일로부터 00일 이내'
};

/* ---------------------------------------------------------------
   2. 화면 목록 (브라우저 탭 제목에 씁니다)
   --------------------------------------------------------------- */
var SCREENS = {
  '/home':           '알앤디 사전가입',
  '/apply':          '기본 정보 입력',
  '/agree':          '약관 동의',
  '/done':           '사전가입 완료',
  '/rotation':       '로테이션 소개',
  '/rotation-meeting': '미팅 날짜 고르기',
  '/rotation-apply': '로테이션 신청',
  '/rotation-done':  '로테이션 신청 완료',
  '/referral':       '친구 추천',
  '/about':          '알앤디 소개'
};

/* ---------------------------------------------------------------
   3. 입력한 내용 임시 보관
   로그인이 없으므로, 신청서를 쓰는 동안에만 쓰는 임시 저장입니다.
   완료 화면을 벗어나면 "내 신청 내용"을 다시 볼 방법은 없습니다.
   --------------------------------------------------------------- */
/* 친구 추천 링크로 들어오면 주소에 코드가 붙어 있습니다 (예: ?ref=RND-1234) */
function refFromLink() {
  try { return new URLSearchParams(location.search).get('ref') || ''; } catch (e) { return ''; }
}

var KEY = 'rnd_wireframe_v1';
function load() { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } }
function save(d) { localStorage.setItem(KEY, JSON.stringify(d)); }
function resetAll() {
  if (!confirm('입력한 내용을 지우고 처음 상태로 돌아갑니다.')) return;
  localStorage.removeItem(KEY);
  location.hash = '#/home';
  render();
}

/* ---------------------------------------------------------------
   4. 화면 그리기 도구
   --------------------------------------------------------------- */
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) {
  return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

/* 마지막 글자에 받침이 있으면 '을', 없으면 '를' */
function josa(word) {
  var c = word.charCodeAt(word.length - 1);
  if (c < 0xAC00 || c > 0xD7A3) return '를';
  return (c - 0xAC00) % 28 !== 0 ? '을' : '를';
}

function appbar(opts) {
  opts = opts || {};
  var left = opts.back
    ? '<button class="back" onclick="history.back()">← 뒤로</button>'
    : '<a class="home" href="#/home" onclick="closeMenu()">' +
        '<span class="logo">로고</span><span class="title">알앤디</span></a>';
  var right = '';
  if (opts.menu) {
    right = '<div class="rightgroup">' +
      (opts.cta ? '<button class="topcta" onclick="location.hash=\'#/apply\'">사전가입</button>' : '') +
      '<button class="hamb" onclick="toggleMenu()" aria-label="메뉴"><i></i><i></i><i></i><span class="xmark">✕</span></button>' +
      '</div>';
  } else if (opts.right) {
    right = '<span class="right">' + esc(opts.right) + '</span>';
  }
  return '<div class="appbar">' + left + right + '</div>';
}

/* 메뉴에 들어갈 탭 목록 */
var MENU = [
  ['#/home',     '사전 가입 신청', '1차 모집 중'],
  ['#/rotation', '로테이션',       '사전가입 다음 단계'],
  ['#/referral', '친구 추천',      ''],
  ['#/about',    '알앤디 소개',    '']
];
function renderMenu(path) {
  document.getElementById('menunav').innerHTML = MENU.map(function (m) {
    var on = ('#' + path) === m[0] ? ' class="on"' : '';
    return '<a href="' + m[0] + '"' + on + ' onclick="closeMenu()">' + esc(m[1]) +
      (m[2] ? '<span class="sub">' + esc(m[2]) + '</span>' : '') + '</a>';
  }).join('');
}
function openFollow() { document.getElementById('follow').classList.add('on'); }
function closeFollow() { document.getElementById('follow').classList.remove('on'); }

function toggleMenu() {
  var m = document.getElementById('menu');
  m.classList.contains('on') ? closeMenu() : openMenu();
}
function openMenu() {
  document.getElementById('menu').classList.add('on');
  var b = document.querySelector('.hamb');
  if (b) b.classList.add('x');
}
function closeMenu() {
  document.getElementById('menu').classList.remove('on');
  var b = document.querySelector('.hamb');
  if (b) b.classList.remove('x');
}

function todo(msg) { return 'alert(\'' + msg + '\');return false'; }

function siteFooter() {
  var a = 'href="#" onclick="' + todo('아직 안 만든 화면입니다') + '"';
  return '<div class="sitefoot">' +
    '<div class="links"><a ' + a + '>이용약관</a> · <a ' + a + '>개인정보처리방침</a> · <a ' + a + '>문의하기</a></div>' +
    '<div class="copy">ZIZZY STUDIO · 사업자등록번호 000-00-00000</div>' +
    '<div class="copy">© 2026 ZIZZY STUDIO</div>' +
    '<button class="restart" onclick="resetAll()">처음부터 다시 보기</button>' +
    '</div>';
}

function field(f, value) {
  var v = value == null ? '' : value;
  var inner = '';
  if (f.type === 'text' || f.type === 'email' || f.type === 'number') {
    inner = '<input type="' + f.type + '" id="f_' + f.key + '" value="' + esc(v) +
      '" placeholder="' + esc(f.placeholder || '') + '">';
  } else if (f.type === 'textarea') {
    inner = '<textarea id="f_' + f.key + '" placeholder="' + esc(f.placeholder || '') + '">' + esc(v) + '</textarea>';
  } else if (f.type === 'select') {
    inner = '<select id="f_' + f.key + '"><option value="">선택하세요</option>' +
      f.options.map(function (o) {
        return '<option' + (o === v ? ' selected' : '') + '>' + esc(o) + '</option>';
      }).join('') + '</select>';
  } else if (f.type === 'radio') {
    inner = '<div class="choices">' + f.options.map(function (o) {
      return '<label><input type="radio" name="f_' + f.key + '" value="' + esc(o) + '"' +
        (o === v ? ' checked' : '') + '>' + esc(o) + '</label>';
    }).join('') + '</div>';
  }
  var verb = (f.type === 'select' || f.type === 'radio') ? '선택해' : '입력해';
  return '<div class="field" id="wrap_' + f.key + '">' +
    '<label class="lb">' + esc(f.label) +
    (f.required ? ' <span class="req">필수</span>' : ' <span class="req">선택</span>') + '</label>' +
    inner + '<div class="err" id="err_' + f.key + '">' + esc(f.label) + josa(f.label) + ' ' + verb + ' 주세요</div></div>';
}

function readFields(fields) {
  var out = {}, bad = null;
  fields.forEach(function (f) {
    var v = '';
    if (f.type === 'radio') {
      var picked = document.querySelector('input[name="f_' + f.key + '"]:checked');
      v = picked ? picked.value : '';
    } else {
      var el = document.getElementById('f_' + f.key);
      v = el ? el.value.trim() : '';
    }
    out[f.key] = v;
    var wrap = document.getElementById('wrap_' + f.key);
    if (!SKIP_VALIDATION && f.required && !v) {
      wrap.classList.add('bad');
      if (!bad) bad = wrap;
    } else {
      wrap.classList.remove('bad');
    }
  });
  if (bad) { bad.scrollIntoView({ behavior: 'smooth', block: 'center' }); return null; }
  return out;
}

   기록만 있고 값이 전부 비어 있으면(검사를 꺼둔 채 빈칸으로 통과한 경우)
   안 한 것으로 봅니다. */
function hasSignup(d) {

/* 미팅 고르기 (로테이션 신청의 첫 화면) */
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function meetingOf(dateStr) {
  for (var i = 0; i < MEETINGS.length; i++) if (MEETINGS[i].date === dateStr) return MEETINGS[i];
  return null;
}
function prettyDate(dateStr) {
  var p = dateStr.split('-');
  var dt = new Date(+p[0], +p[1] - 1, +p[2]);
  return (+p[1]) + '월 ' + (+p[2]) + '일 (' + DOW[dt.getDay()] + ')';
}
function pickMeeting(dateStr) {
  var d = load();
  d.meetingDate = dateStr;
  save(d);
  render();
}

function calendarHtml(monthStr, pick) {
  var y = +monthStr.split('-')[0], m = +monthStr.split('-')[1];
  var startDow = new Date(y, m - 1, 1).getDay();
  var lastDay = new Date(y, m, 0).getDate();

  var cells = [];
  var i;
  for (i = 0; i < startDow; i++) cells.push(null);
  for (i = 1; i <= lastDay; i++) cells.push(i);
  while (cells.length % 7 !== 0) cells.push(null);

  var html = '<div class="calhead">' + y + '년 ' + m + '월</div>' +
    '<table class="cal"><tr>' + DOW.map(function (w) { return '<th>' + w + '</th>'; }).join('') + '</tr>';

  for (i = 0; i < cells.length; i += 7) {
    html += '<tr>';
    for (var j = 0; j < 7; j++) {
      var day = cells[i + j];
      if (!day) { html += '<td></td>'; continue; }
      var key = y + '-' + pad2(m) + '-' + pad2(day);
      var mt = meetingOf(key);
      var cls = 'day';
      var mark = '';
      if (mt) {
        var left = mt.cap - mt.joined;
        if (left <= 0) { cls += ' full'; mark = '<span class="mark">마감</span>'; }
        else { cls += ' has'; mark = '<span class="mark">' + left + '자리</span>'; }
        if (key === pick) cls += ' on';
        html += '<td><button class="' + cls + '" onclick="pickMeeting(\'' + key + '\')">' + day + mark + '</button></td>';
      } else {
        html += '<td><span class="' + cls + '">' + day + '</span></td>';
      }
    }
    html += '</tr>';
  }
  return html + '</table>' +
    '<div class="callegend">테두리가 있는 날에 미팅이 열립니다</div>';
}

      '</div></div>' +
    '</div>' +

    /* 2. 리워드가 무엇인지 */
    '<div class="sec">' +
      '<h2>받는 리워드</h2>' +
      '<p style="margin-bottom:14px">쌓인 응모권으로 룰렛을 돌려 경품을 받습니다.</p>' +
      '<div class="wheelshot">' +
        '<img src="wheel.svg" alt="리워드 룰렛">' +
        '<span class="pin"></span>' +

      '</div>' +
    '</div>' +

    '<div class="sec">' +
      '<h2>경품</h2>' +
      '<div class="card"><h3>1등 맥북</h3><p class="muted">아이패드, 에어팟, 쿠팡이츠, 인앱 재화 루미까지</p></div>' +
    '</div>' +

    /* 룰렛은 이 화면에서 못 돌린다는 안내 */
    '<div class="sec last">' +
      '<h2>룰렛은 어디서 돌리나요</h2>' +
      '<p>카카오 채널로 보내드리는 <b>내 전용 링크</b>에서 돌립니다. 응모권이 쌓이면 그 링크에서 바로 돌릴 수 있어요.</p>' +
      '<div class="cta"><button class="btn" onclick="location.hash=\'#/apply\'">사전 가입 신청하기</button></div>' +
      '<div class="hint" style="text-align:center;font-size:12px;color:#777;margin-top:10px">사전가입을 마쳐야 추천 링크가 발급됩니다</div>' +
    '</div>' +

    siteFooter() +
    '</div>';
};

/* 알앤디 소개 (아직 뼈대만) */

/* 로테이션 완료 */
views['/rotation-done'] = function (d) {

/* ---------------------------------------------------------------
   6. 동작
   --------------------------------------------------------------- */
function submitApply() {
  var v = readFields(SIGNUP_FIELDS);
  if (!v) return;
  var d = load();
  d.signupDraft = v;
  save(d);
  location.hash = '#/agree';
}

function toggleAll(el) {
  var list = document.querySelectorAll('.ag');
  for (var i = 0; i < list.length; i++) list[i].checked = el.checked;
}

function submitAgree() {
  var ok = document.getElementById('ag1').checked && document.getElementById('ag2').checked;
  var wrap = document.getElementById('wrap_agree');
  if (!SKIP_VALIDATION && !ok) { wrap.classList.add('bad'); wrap.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
  wrap.classList.remove('bad');
  var d = load();
  d.signup = d.signupDraft || {};
  d.marketing = document.getElementById('ag3').checked;
  d.code = 'RND-' + String(Math.floor(Math.random() * 9000) + 1000);
  delete d.signupDraft;
  save(d);
  location.hash = '#/done';
  /* 제출 직후 인스타그램 팔로우 안내를 띄웁니다 */
  window.setTimeout(openFollow, 260);
}

/* 학력 인증.
   진짜 서비스에서는 여기서 서류 파일을 올리고 우리가 확인합니다.
   지금은 플로우를 보는 단계라 누르면 인증된 것으로 처리합니다. */
function docVerify() { var d = load(); keepDraft(d); d.docVerified = true; save(d); render(); }
function docReset() { var d = load(); keepDraft(d); delete d.docVerified; save(d); render(); }

/* 화면을 다시 그리기 전에, 입력칸에 쳐둔 값을 잠시 보관합니다.
   이게 없으면 학력 인증 버튼을 누를 때 입력한 내용이 사라집니다. */
function keepDraft(d) {
  if (!document.getElementById('f_' + ROTATION_FIELDS[0].key)) return;
  var draft = {};
  ROTATION_FIELDS.forEach(function (f) {
    var v = '';
    if (f.type === 'radio') {
      var picked = document.querySelector('input[name="f_' + f.key + '"]:checked');
      v = picked ? picked.value : '';
    } else {
      var el = document.getElementById('f_' + f.key);
      v = el ? el.value : '';
    }
    draft[f.key] = v;
  });
  d.rotationDraft = draft;
}

function submitRotation() {
  var d = load();
  var prefilled = !!d.fromSignup && hasSignup(d);

  /* 사전가입을 한 사람은 기본 정보를 화면에서 받지 않고, 저장된 값을 그대로 씁니다 */
  var v = prefilled ? {} : readFields(ROTATION_FIELDS);
  if (!v) return;
  if (prefilled) {
    ROTATION_FIELDS.forEach(function (f) { v[f.key] = d.signup[f.key]; });
  }

  /* 학력 인증을 안 했으면 막습니다 */
  if (!SKIP_VALIDATION && !d.docVerified) {
    var wrap = document.getElementById('wrap_doc');
    if (wrap) { wrap.classList.add('bad'); wrap.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    return;
  }

  var digits = String(Math.floor(Math.random() * 9000) + 1000);
  d.rotation = v;
  d.rotationCode = 'RND-R' + digits;
  d.payName = (v.name || '') + digits;
  save(d);
  location.hash = '#/rotation-done';
}

/* ---------------------------------------------------------------
   7. 화면 전환
   --------------------------------------------------------------- */
function render() {
  var path = location.hash.replace('#', '');
  if (!views[path]) path = '/home';
  var d = load();

  /* 앞 단계를 건너뛰고 주소로 바로 들어오면 되돌려 보냅니다 */
  if (path === '/agree' && !d.signupDraft) path = '/apply';
  if (path === '/done' && !d.signup) path = '/home';
  if (path === '/rotation-done' && !d.rotationCode) path = '/rotation';

  if (location.hash !== '#' + path) history.replaceState(null, '', '#' + path);

  document.title = SCREENS[path] + ' · 알앤디';
  document.getElementById('stage').innerHTML = views[path](d);
  renderMenu(path);
  closeMenu();
  window.scrollTo(0, 0);
}

window.addEventListener('hashchange', render);
if (!location.hash) history.replaceState(null, '', '#/home');
render();
</script>
